name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Creating tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify root module
        run: |
          go mod download
          go mod tidy
          git diff --exit-code go.mod go.sum
          go build ./...
          go test -race -count=1 ./...

      # Every directory under drivers/ with its own go.mod is a separate Go
      # module. Go resolves a nested module only through a tag prefixed with
      # its path (drivers/slack/v1.7.0), so the root tag alone leaves them
      # unfetchable. Discovering them here means a new driver ships without
      # anyone having to remember to add it to a list.
      - name: Discover driver sub-modules
        id: drivers
        run: |
          DRIVERS=""
          for gomod in drivers/*/go.mod; do
            [ -f "$gomod" ] || continue
            DRIVERS="$DRIVERS $(basename "$(dirname "$gomod")")"
          done
          DRIVERS="${DRIVERS# }"
          if [ -z "$DRIVERS" ]; then
            echo "::error::no driver sub-modules found under drivers/"
            exit 1
          fi
          echo "Driver sub-modules: $DRIVERS"
          echo "list=$DRIVERS" >> "$GITHUB_OUTPUT"

      - name: Verify driver sub-modules
        run: |
          for mod in ${{ steps.drivers.outputs.list }}; do
            echo "::group::Verifying drivers/$mod"
            (
              cd "drivers/$mod"
              go mod download
              go mod tidy
              git diff --exit-code go.mod go.sum
              go build ./...
              go test -race -count=1 ./...
            )
            echo "::endgroup::"
          done

      - name: Tag driver sub-modules
        run: |
          TAG="${{ steps.set-tag.outputs.tag }}"
          TARGET=$(git rev-parse "$TAG^{commit}")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_TAGS=()
          for mod in ${{ steps.drivers.outputs.list }}; do
            MOD_TAG="drivers/$mod/$TAG"
            # A re-run after a partial push finds some tags already there.
            # Skip those, but refuse one that points at a different commit.
            if git rev-parse -q --verify "refs/tags/$MOD_TAG" >/dev/null; then
              if [ "$(git rev-parse "$MOD_TAG^{commit}")" != "$TARGET" ]; then
                echo "::error::$MOD_TAG exists but does not point at $TAG ($TARGET)"
                exit 1
              fi
              echo "$MOD_TAG already exists, skipping"
              continue
            fi
            echo "Tagging $MOD_TAG"
            git tag "$MOD_TAG" "$TARGET"
            NEW_TAGS+=("$MOD_TAG")
          done

          if [ "${#NEW_TAGS[@]}" -gt 0 ]; then
            git push origin "${NEW_TAGS[@]}"
          fi

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          TAG="${{ steps.set-tag.outputs.tag }}"
          {
            echo "drivers<<EOF"
            for mod in ${{ steps.drivers.outputs.list }}; do
              echo "go get github.com/xraph/herald/drivers/$mod@$TAG"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ---

            ### Installation

            ```bash
            go get github.com/xraph/herald@${{ steps.set-tag.outputs.tag }}
            ```

            Driver sub-modules:
            ```bash
            ${{ steps.notes.outputs.drivers }}
            ```
          generate_release_notes: true
